services:
  adapter:
    build: .
    container_name: mcp-agent-mailbox-adapter
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ADAPTER_BIND: 0.0.0.0
      ADAPTER_CONTAINER: "1"
      ADAPTER_DATA_DIR: /data
      ADAPTER_PORT: "8788"
      # .env uses 127.0.0.1, which is the container itself. The mailbox is on the host.
      MAILBOX_URL: http://host.docker.internal:8797/mcp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - ./data/adapter:/data
