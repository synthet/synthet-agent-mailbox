services:
  dashboard:
    build: .
    container_name: agent-mailbox
    restart: "no"
    environment:
      AGENT_MAIL_HOME: /data/agent-mail
      DASHBOARD_BIND: 0.0.0.0
      DASHBOARD_CONTAINER: "1"
      DASHBOARD_PORT: "8788"
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      # This PC's peer store. The container only reads it.
      - ${USERPROFILE}/.agent-mail:/data/agent-mail:ro
