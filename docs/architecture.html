<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Mailbox Architecture</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --panel-edge: #cfd5de; --ink: #1b2430; --muted: #5b6676;
    --host: #0f766e; --host-bg: #e3f4f1; --adapter: #1d4ed8; --adapter-bg: #e4ecfd;
    --agent: #6d28d9; --agent-bg: #efe7fb; --lan: #b45309; --lan-bg: #fdf0dc; --warn: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11151b; --panel: #181e27; --panel-edge: #2c3646; --ink: #e6ebf2; --muted: #93a0b3;
      --host: #5eead4; --host-bg: #12332f; --adapter: #93b4ff; --adapter-bg: #1b2a4d;
      --agent: #c4a8ff; --agent-bg: #2b2146; --lan: #fbbf5a; --lan-bg: #3a2b12; --warn: #f87171;
    }
  }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, "Segoe UI", sans-serif; }
  main { max-width: 1140px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  svg { width: 100%; height: auto; display: block; }
  text { fill: var(--ink); font-family: system-ui, "Segoe UI", sans-serif; }
  .t-title { font-size: 15px; font-weight: 650; }
  .t-body { font-size: 12.5px; }
  .t-mute { font-size: 12px; fill: var(--muted); }
  .t-label { font-size: 12px; font-weight: 600; }
  .panel { fill: var(--panel); stroke: var(--panel-edge); stroke-width: 1.5; }
  .agent { fill: var(--agent-bg); stroke: var(--agent); stroke-width: 1.5; }
  .adapter { fill: var(--adapter-bg); stroke: var(--adapter); stroke-width: 1.5; }
  .host { fill: var(--host-bg); stroke: var(--host); stroke-width: 1.5; }
  .lan { fill: var(--lan-bg); stroke: var(--lan); stroke-width: 1.5; }
  .ghost { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
  .flow { fill: none; stroke: var(--adapter); stroke-width: 2; }
  .flow-lan { fill: none; stroke: var(--lan); stroke-width: 2.5; }
  .chip { fill: var(--panel); stroke: var(--agent); stroke-width: 1; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
</style>
</head>
<body>
<main>
  <h1>Agent Mailbox: Zephyr and TridentX</h1>
  <p class="sub">Each agent talks only to the adapter on its own PC. The adapters talk to the one mailbox host, which runs in Docker on Zephyr.</p>

  <svg viewBox="0 0 1100 690" role="img" aria-labelledby="dt dd">
    <title id="dt">Architecture of the agent mailbox across two PCs</title>
    <desc id="dd">Agents on Zephyr and on TridentX connect to local adapters on port 8788. Both adapters reach the mailbox container on Zephyr at port 8797. TridentX crosses the LAN.</desc>
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="var(--adapter)"/>
      </marker>
      <marker id="ahl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="var(--lan)"/>
      </marker>
    </defs>

    <!-- ZEPHYR -->
    <rect class="panel" x="20" y="20" width="1060" height="310" rx="14"/>
    <text class="t-title" x="40" y="48">Zephyr (main PC) &#183; 192.0.2.20 &#183; agent id desktop-builder</text>

    <rect class="agent" x="50" y="70" width="250" height="235" rx="10"/>
    <text class="t-title" x="66" y="94">Agents (user-level MCP)</text>
    <rect class="chip" x="66" y="108" width="218" height="34" rx="7"/><text class="t-body" x="80" y="130">Claude Code</text>
    <rect class="chip" x="66" y="150" width="218" height="34" rx="7"/><text class="t-body" x="80" y="172">Cursor</text>
    <rect class="chip" x="66" y="192" width="218" height="34" rx="7"/><text class="t-body" x="80" y="214">Codex</text>
    <rect class="chip" x="66" y="234" width="218" height="34" rx="7"/><text class="t-body" x="80" y="256">Antigravity / Gemini CLI</text>
    <text class="t-mute" x="66" y="291">token from env AGENT_TOKEN</text>

    <rect class="adapter" x="420" y="105" width="230" height="130" rx="10"/>
    <text class="t-title" x="436" y="130">Adapter</text>
    <text class="t-body" x="436" y="153">127.0.0.1:8788/mcp</text>
    <text class="t-body" x="436" y="173">outbox + inbox spool (SQLite)</text>
    <text class="t-body" x="436" y="193">optional wake: claude, codex,</text>
    <text class="t-body" x="436" y="211">cursor, gemini (WAKE=off now)</text>

    <rect class="ghost" x="420" y="257" width="230" height="48" rx="8"/>
    <text class="t-mute" x="436" y="278">ai-quotas on :8787</text>
    <text class="t-mute" x="436" y="295">unrelated app, not used</text>

    <rect class="host" x="780" y="70" width="270" height="235" rx="12"/>
    <text class="t-title" x="798" y="96">Mailbox host (Docker)</text>
    <text class="t-body" x="798" y="118">container agent-mailbox, healthy</text>
    <text class="t-body" x="798" y="138">published 0.0.0.0:8797 &#8594; 8787</text>
    <text class="t-body" x="798" y="164">bearer token picks the sender</text>
    <text class="t-body" x="798" y="184">leases, retries, dead letters</text>
    <rect class="chip" x="798" y="202" width="234" height="34" rx="7" style="stroke:var(--host)"/><text class="t-body" x="812" y="224">volume mailbox-data (SQLite)</text>
    <rect class="chip" x="798" y="246" width="234" height="34" rx="7" style="stroke:var(--host)"/><text class="t-body" x="812" y="268">agents.json (read-only mount)</text>

    <path class="flow" d="M300 170 H420" marker-end="url(#ah)"/>
    <text class="t-label" x="310" y="160" style="fill:var(--adapter)">MCP http</text>
    <path class="flow" d="M650 170 H780" marker-end="url(#ah)"/>
    <text class="t-label" x="662" y="160" style="fill:var(--adapter)">:8797</text>

    <!-- LAN gap -->
    <text class="t-label" x="560" y="362" style="fill:var(--lan)">LAN, plain HTTP, 192.168.1.x</text>
    <rect class="lan" x="560" y="372" width="330" height="42" rx="8"/>
    <text class="t-body" x="574" y="390">Windows Firewall: allow inbound TCP 8797</text>
    <text class="t-body" x="574" y="406">(Private profile) on Zephyr</text>

    <!-- PC-A -->
    <rect class="panel" x="20" y="350" width="1060" height="320" rx="14"/>
    <text class="t-title" x="40" y="378">TridentX (second PC) &#183; agent id laptop-reviewer</text>

    <rect class="agent" x="50" y="400" width="250" height="235" rx="10"/>
    <text class="t-title" x="66" y="424">Agents (user-level MCP)</text>
    <rect class="chip" x="66" y="438" width="218" height="34" rx="7"/><text class="t-body" x="80" y="460">Claude Code &#183; set</text>
    <rect class="chip" x="66" y="480" width="218" height="34" rx="7"/><text class="t-body" x="80" y="502">Cursor &#183; set</text>
    <rect class="chip" x="66" y="522" width="218" height="34" rx="7" style="stroke-dasharray:4 3"/><text class="t-body" x="80" y="544">Codex &#183; to add</text>
    <rect class="chip" x="66" y="564" width="218" height="34" rx="7" style="stroke-dasharray:4 3"/><text class="t-body" x="80" y="586">Antigravity / Gemini CLI &#183; to add</text>
    <text class="t-mute" x="66" y="621">token from env AGENT_TOKEN</text>

    <rect class="adapter" x="420" y="470" width="230" height="130" rx="10"/>
    <text class="t-title" x="436" y="495">Adapter</text>
    <text class="t-body" x="436" y="518">127.0.0.1:8788/mcp</text>
    <text class="t-body" x="436" y="538">outbox + inbox spool (SQLite)</text>
    <text class="t-body" x="436" y="561" style="fill:var(--warn)">not running yet</text>
    <text class="t-body" x="436" y="581" style="fill:var(--warn)">needs project + AGENT_TOKEN</text>

    <rect class="ghost" x="780" y="520" width="270" height="100" rx="10"/>
    <text class="t-title" x="798" y="546">Resilio Sync folder</text>
    <text class="t-mute" x="798" y="568">setup notes, project zip, and</text>
    <text class="t-mute" x="798" y="586">the token handoff (env.txt)</text>
    <text class="t-mute" x="798" y="604">shared by both PCs</text>

    <path class="flow" d="M300 535 H420" marker-end="url(#ah)"/>
    <text class="t-label" x="310" y="525" style="fill:var(--adapter)">MCP http</text>
    <path class="flow-lan" d="M650 535 H915 V305" marker-end="url(#ahl)"/>
    <text class="t-label" x="680" y="525" style="fill:var(--lan)">http://192.0.2.20:8797/mcp</text>
  </svg>

  <div class="legend">
    <span><i style="background:var(--agent)"></i>Agent clients</span>
    <span><i style="background:var(--adapter)"></i>Local adapter (loopback only)</span>
    <span><i style="background:var(--host)"></i>Mailbox host</span>
    <span><i style="background:var(--lan)"></i>LAN link</span>
    <span>Dashed: not done yet, or not part of the system</span>
  </div>
</main>
</body>
</html>
